<div class="mx-404" role="img" aria-label="404 error animation: cascading digital rain with a 404 in the middle">
  <div class="mx-screen">
    <span class="mx-col" style="left: 6px;   animation-duration: 2.6s; animation-delay: -0.2s;">404104047140441004</span>
    <span class="mx-col" style="left: 27px;  animation-duration: 3.4s; animation-delay: -1.1s;">010440714004401470</span>
    <span class="mx-col" style="left: 48px;  animation-duration: 2.2s; animation-delay: -0.6s;">440047010441004047</span>
    <span class="mx-col" style="left: 69px;  animation-duration: 3.9s; animation-delay: -2.0s;">104400471040044170</span>
    <span class="mx-col" style="left: 90px;  animation-duration: 2.9s; animation-delay: -0.9s;">471004040147440010</span>
    <span class="mx-col" style="left: 111px; animation-duration: 3.2s; animation-delay: -1.6s;">040471104400147040</span>
    <span class="mx-col" style="left: 132px; animation-duration: 2.4s; animation-delay: -0.4s;">144004710404401047</span>

  <span class="mx-cap">SYSTEM DOWN</span>

<style>
  .mx-404 {
    --mx-ink: #0f191e;
    --mx-accent: #f4ff2b;
    --mx-shell: #ffffff;
    display: grid;
    justify-items: center;
    gap: 8px;
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", monospace;
  }

  .mx-screen {
    position: relative;
    width: 150px;
    height: 108px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--mx-ink);
  }

  /* Each column is one glyph wide, so its digits wrap into a vertical strip;
     the string is written twice so a -50% shift loops seamlessly. */
  .mx-col {
    position: absolute;
    top: 0;
    width: 1ch;
    font-size: 12px;
    line-height: 14px;
    font-weight: 700;
    word-break: break-all;
    color: var(--mx-accent);
    /* Fades the head of each stream, leaving a bright tail. */
    background: linear-gradient(var(--mx-ink), color-mix(in srgb, var(--mx-accent) 30%, var(--mx-ink)) 30%, var(--mx-accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation-name: mx-fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  /* The 404 the noise keeps forming around. */
  .mx-chip {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 2px 6px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--mx-ink);
    background: var(--mx-accent);
    border-radius: 4px;
    animation: mx-flicker 3s steps(1) infinite;
  }

  .mx-cap {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: var(--mx-ink);
    opacity: 0.75;
  }

  @keyframes mx-fall {
    from { transform: translateY(-50%); }
    to   { transform: translateY(0); }
  }
  @keyframes mx-flicker {
    0%, 46%, 54%, 100% { opacity: 1; }
    48%, 52%           { opacity: 0.55; }
    50%                { opacity: 0.85; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mx-404 .mx-col,
    .mx-404 .mx-chip { animation: none; }
  }
</style>
