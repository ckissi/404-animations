<!-- 404 · Left on Read — a chat thread where the server starts typing, thinks
     better of it, and never replies. Pure CSS, self-contained, no dependencies.
     Retheme via the custom properties on .ct-404.
     MIT licensed — 404.colorion.co -->
<div class="ct-404" role="img" aria-label="404 error animation: a chat message left on read, with a typing indicator that never resolves">
  <div class="ct-thread">
    <span class="ct-bubble ct-out">GET /page</span>
    <span class="ct-receipt">Read 4:04</span>
    <span class="ct-bubble ct-in">
      <i class="ct-dot" style="--i: 0;"></i>
      <i class="ct-dot" style="--i: 1;"></i>
      <i class="ct-dot" style="--i: 2;"></i>
    </span>
  </div>
  <span class="ct-cap">404 · LEFT ON READ</span>
</div>

<style>
  .ct-404 {
    --ct-ink: #0f191e;
    --ct-accent: #f4ff2b;
    --ct-shell: #ffffff;
    display: grid;
    justify-items: center;
    gap: 12px;
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", monospace;
  }

  .ct-thread {
    display: grid;
    justify-items: end;
    gap: 4px;
    width: 128px;
  }

  .ct-bubble {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 9px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.06em;
    border-radius: 11px;
  }

  /* Outgoing request — always delivered, never answered. */
  .ct-out {
    background: var(--ct-accent);
    color: var(--ct-ink);
    border-bottom-right-radius: 3px;
  }

  .ct-receipt {
    font-size: 6px;
    letter-spacing: 0.16em;
    color: color-mix(in srgb, var(--ct-ink) 50%, var(--ct-shell));
    animation: ct-receipt 7s ease-out infinite;
  }

  /* Incoming bubble: appears, types, gives up, disappears. */
  .ct-in {
    justify-self: start;
    margin-top: 2px;
    padding: 7px 9px;
    background: color-mix(in srgb, var(--ct-ink) 16%, var(--ct-shell));
    border-bottom-left-radius: 3px;
    transform-origin: 0 100%;
    animation: ct-appear 7s ease-in-out infinite;
  }

  .ct-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--ct-ink) 55%, var(--ct-shell));
    animation: ct-bounce 1.1s ease-in-out infinite;
    animation-delay: calc(var(--i) * 0.16s);
  }

  .ct-cap {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: var(--ct-ink);
    opacity: 0.75;
    animation: ct-cap 7s ease-in-out infinite;
  }

  @keyframes ct-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30%           { transform: translateY(-4px); opacity: 1; }
  }

  /* Two false starts: the typing bubble pops in, holds, then vanishes. */
  @keyframes ct-appear {
    0%, 10%   { opacity: 0; transform: scale(0.6); }
    16%, 40%  { opacity: 1; transform: scale(1); }
    46%, 60%  { opacity: 0; transform: scale(0.7); }
    66%, 82%  { opacity: 1; transform: scale(1); }
    88%, 100% { opacity: 0; transform: scale(0.7); }
  }

  @keyframes ct-receipt {
    0%, 4%    { opacity: 0; transform: translateY(-3px); }
    10%, 100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes ct-cap {
    0%, 46%   { opacity: 0.28; }
    56%, 60%  { opacity: 1; }
    70%, 100% { opacity: 0.28; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ct-404 .ct-in,
    .ct-404 .ct-dot,
    .ct-404 .ct-cap,
    .ct-404 .ct-receipt { animation: none; }
    .ct-404 .ct-in { opacity: 1; transform: none; }
    .ct-404 .ct-dot { opacity: 0.7; }
  }
</style>
