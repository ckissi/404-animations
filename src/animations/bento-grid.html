<!-- 404 · Rearranging — a bento grid whose tiles ripple while the three
     accent tiles hold 4 · 0 · 4. Pure CSS, self-contained, no dependencies.
     Retheme via the custom properties on .bn-404.
     MIT licensed — 404.colorion.co -->
<div class="bn-404" role="img" aria-label="404 error animation: a bento grid rippling, with tiles reading 4 0 4">
  <div class="bn-grid">
    <span class="bn-tile bn-fill" style="--d: 0s;   grid-area: 1 / 1 / 2 / 2;"></span>
    <span class="bn-tile bn-fill" style="--d: -0.4s; grid-area: 1 / 2 / 2 / 4;"></span>
    <span class="bn-tile bn-num"  style="--d: -0.2s; grid-area: 2 / 1 / 3 / 2;">4</span>
    <span class="bn-tile bn-num"  style="--d: -0.6s; grid-area: 2 / 2 / 3 / 3;">0</span>
    <span class="bn-tile bn-num"  style="--d: -1s;   grid-area: 2 / 3 / 3 / 4;">4</span>
    <span class="bn-tile bn-fill" style="--d: -0.8s; grid-area: 3 / 1 / 4 / 3;"></span>
    <span class="bn-tile bn-fill" style="--d: -1.2s; grid-area: 3 / 3 / 4 / 4;"></span>
  </div>
</div>

<style>
  .bn-404 {
    --bn-ink: #0f191e;
    --bn-accent: #f4ff2b;
    --bn-shell: #ffffff;
    display: grid;
    justify-items: center;
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", monospace;
  }

  .bn-grid {
    display: grid;
    width: 144px;
    height: 108px;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
  }

  .bn-tile {
    border-radius: 9px;
    display: grid;
    place-items: center;
  }

  .bn-fill {
    background: color-mix(in srgb, var(--bn-ink) 90%, transparent);
    animation: bn-ripple 3.6s ease-in-out infinite;
    animation-delay: var(--d);
  }

  .bn-num {
    background: var(--bn-accent);
    color: var(--bn-ink);
    font-size: 22px;
    font-weight: 800;
    animation: bn-glow 3.6s ease-in-out infinite;
    animation-delay: var(--d);
  }

  /* A dip in scale/opacity travelling across the fillers reads as shuffling. */
  @keyframes bn-ripple {
    0%, 68%, 100% { transform: scale(1); opacity: 1; }
    84%           { transform: scale(0.7); opacity: 0.35; }
  }
  @keyframes bn-glow {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 transparent; }
    50%      { transform: scale(1.06); box-shadow: 0 0 14px color-mix(in srgb, var(--bn-accent) 65%, transparent); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bn-404 .bn-tile { animation: none; }
  }
</style>
