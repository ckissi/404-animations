<!-- 404 · Skipping Record — the turntable keeps skipping on track 404.
     Pure CSS, self-contained, no dependencies. Retheme via the custom
     properties on .vy-404. MIT licensed — 404.colorion.co -->
<div class="vy-404" role="img" aria-label="404 error animation: a vinyl record skipping on track 404">
  <div class="vy-deck">
    <div class="vy-disc">
      <span class="vy-label">404</span>
    </div>
    <div class="vy-arm"></div>
  </div>
  <span class="vy-note">TRACK NOT FOUND — SKIPPING</span>
</div>

<style>
  .vy-404 {
    --vy-ink: #0f191e;
    --vy-accent: #f4ff2b;
    --vy-shell: #ffffff;
    display: grid;
    justify-items: center;
    gap: 8px;
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", monospace;
  }

  .vy-deck {
    position: relative;
    width: 148px;
    height: 116px;
  }

  .vy-disc {
    position: absolute;
    top: 50%;
    left: 6px;
    width: 104px;
    height: 104px;
    margin-top: -52px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    /* grooves */
    background: repeating-radial-gradient(
      circle at center,
      var(--vy-ink) 0 3px,
      color-mix(in srgb, var(--vy-shell) 14%, var(--vy-ink)) 3px 5px
    );
    animation: vy-spin 4s linear infinite;
  }

  .vy-label {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--vy-ink);
    background: var(--vy-accent);
    border: 2px solid var(--vy-ink);
    border-radius: 50%;
    box-sizing: border-box;
  }

  /* spindle */
  .vy-label::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--vy-ink);
    border-radius: 50%;
  }

  /* Tonearm, pivoting from the top-right corner. */
  .vy-arm {
    position: absolute;
    top: 22px;
    right: 4px;
    width: 58px;
    height: 5px;
    border-radius: 3px;
    background: var(--vy-ink);
    transform-origin: calc(100% - 7px) 50%;
    transform: rotate(38deg);
    animation: vy-jitter 4s infinite;
  }

  /* pivot */
  .vy-arm::before {
    content: "";
    position: absolute;
    right: 0;
    top: 50%;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    background: var(--vy-ink);
    border: 2px solid var(--vy-shell);
    box-sizing: border-box;
    border-radius: 50%;
  }

  /* cartridge head */
  .vy-arm::after {
    content: "";
    position: absolute;
    left: -2px;
    top: 50%;
    width: 10px;
    height: 11px;
    margin-top: -5.5px;
    background: var(--vy-ink);
    border-radius: 3px;
  }

  .vy-note {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    color: var(--vy-ink);
    animation: vy-stutter 4s infinite;
  }

  /* Smooth rotation that jerks back at 70% — the skip — then carries on to a
     full turn so the loop is seamless. */
  @keyframes vy-spin {
    0%   { transform: rotate(0); }
    68%  { transform: rotate(255deg); }
    71%  { transform: rotate(213deg); }
    74%  { transform: rotate(255deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes vy-jitter {
    0%, 66%, 78%, 100% { transform: rotate(38deg); }
    69% { transform: rotate(35.5deg); }
    72% { transform: rotate(40deg); }
    75% { transform: rotate(36.5deg); }
  }

  @keyframes vy-stutter {
    0%, 64%, 80%, 100% { opacity: 0.7; }
    68%, 76%           { opacity: 1; }
    72%                { opacity: 0.25; }
  }

  @media (prefers-reduced-motion: reduce) {
    .vy-404 .vy-disc,
    .vy-404 .vy-arm,
    .vy-404 .vy-note { animation: none; }
    .vy-404 .vy-note { opacity: 1; }
  }
</style>
