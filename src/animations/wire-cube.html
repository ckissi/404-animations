<!-- 404 · Lost in Space — a neon 3D cube tumbles end over end, its faces
     reading 4 · 0 · 4 · ? · N · F. Pure CSS 3D transforms, self-contained,
     no dependencies. Retheme via the custom properties on .cb-404.
     MIT licensed — 404.colorion.co -->
<div class="cb-404" role="img" aria-label="404 error animation: a 3D cube tumbling through space, its faces reading 4 0 4">
  <div class="cb-scene">
    <div class="cb-cube">
      <span class="cb-face cb-f1">4</span>
      <span class="cb-face cb-f2">0</span>
      <span class="cb-face cb-f3">4</span>
      <span class="cb-face cb-f4">?</span>
      <span class="cb-face cb-f5">N</span>
      <span class="cb-face cb-f6">F</span>
    </div>
  </div>
</div>

<style>
  .cb-404 {
    --cb-ink: #0f191e;
    --cb-accent: #f4ff2b;
    --cb-shell: #ffffff;
    display: grid;
    justify-items: center;
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", monospace;
  }

  .cb-scene {
    width: 120px;
    height: 120px;
    display: grid;
    place-items: center;
    perspective: 360px;
  }

  .cb-cube {
    position: relative;
    width: 76px;
    height: 76px;
    transform-style: preserve-3d;
    animation: cb-tumble 11s linear infinite;
  }

  .cb-face {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    box-sizing: border-box;
    font-size: 34px;
    font-weight: 800;
    color: var(--cb-accent);
    background: color-mix(in srgb, var(--cb-ink) 82%, transparent);
    border: 2px solid var(--cb-accent);
    box-shadow: inset 0 0 14px color-mix(in srgb, var(--cb-accent) 22%, transparent);
  }

  .cb-f1 { transform: rotateY(0deg)   translateZ(38px); }
  .cb-f2 { transform: rotateY(90deg)  translateZ(38px); }
  .cb-f3 { transform: rotateY(180deg) translateZ(38px); }
  .cb-f4 { transform: rotateY(-90deg) translateZ(38px); }
  .cb-f5 { transform: rotateX(90deg)  translateZ(38px); }
  .cb-f6 { transform: rotateX(-90deg) translateZ(38px); }

  @keyframes cb-tumble {
    from { transform: rotateX(0deg) rotateY(0deg); }
    to   { transform: rotateX(360deg) rotateY(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cb-404 .cb-cube {
      animation: none;
      transform: rotateX(-24deg) rotateY(-32deg);
    }
  }
</style>
