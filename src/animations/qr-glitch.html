<!-- 404 · Scan Failed — a QR code glitches and scrambles under a scan line
     that never gets a read. Pure CSS, self-contained, no dependencies.
     Retheme via the custom properties on .qr-404.
     MIT licensed — 404.colorion.co -->
<div class="qr-404" role="img" aria-label="404 error animation: a glitching QR code failing to scan">
  <div class="qr-code">
    <span class="qr-field"></span>
    <span class="qr-eye qr-tl"></span>
    <span class="qr-eye qr-tr"></span>
    <span class="qr-eye qr-bl"></span>
    <span class="qr-scan"></span>
  </div>
  <span class="qr-cap">SCAN FAILED · 404</span>
</div>

<style>
  .qr-404 {
    --qr-ink: #0f191e;
    --qr-accent: #f4ff2b;
    --qr-shell: #ffffff;
    display: grid;
    justify-items: center;
    gap: 9px;
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", monospace;
  }

  .qr-code {
    position: relative;
    width: 104px;
    height: 104px;
    box-sizing: border-box;
    padding: 8px;
    border-radius: 10px;
    background: var(--qr-shell);
    overflow: hidden;
  }

  /* Two offset checker layers read as a dense, pseudo-random module field;
     shifting their positions scrambles the "data". */
  .qr-field {
    position: absolute;
    inset: 8px;
    background:
      repeating-conic-gradient(var(--qr-ink) 0 25%, transparent 0 50%) 0 0 / 12px 12px,
      repeating-conic-gradient(var(--qr-ink) 0 25%, transparent 0 50%) 5px 7px / 16px 16px;
    animation: qr-scramble 0.45s steps(2) infinite;
  }

  /* Finder eyes: ink ring, white gap, ink pupil — masked over the field. */
  .qr-eye {
    position: absolute;
    width: 26px;
    height: 26px;
    box-sizing: border-box;
    background: var(--qr-shell);
    border: 4px solid var(--qr-ink);
    border-radius: 3px;
  }
  .qr-eye::after {
    content: "";
    position: absolute;
    inset: 4px;
    background: var(--qr-ink);
    border-radius: 1px;
  }
  .qr-tl { top: 8px;  left: 8px; }
  .qr-tr { top: 8px;  right: 8px; }
  .qr-bl { bottom: 8px; left: 8px; }

  /* Scan line sweeping down, finding nothing. */
  .qr-scan {
    position: absolute;
    left: 6px;
    right: 6px;
    height: 3px;
    border-radius: 3px;
    background: var(--qr-accent);
    box-shadow: 0 0 8px 1px color-mix(in srgb, var(--qr-accent) 70%, transparent);
    animation: qr-sweep 2.6s ease-in-out infinite;
  }

  .qr-cap {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: var(--qr-ink);
    opacity: 0.75;
  }

  @keyframes qr-scramble {
    0%   { background-position: 0 0, 5px 7px; }
    50%  { background-position: 6px 0, 0 12px; }
    100% { background-position: 0 6px, 9px 3px; }
  }
  @keyframes qr-sweep {
    0%, 100% { top: 8px; opacity: 0.9; }
    50%      { top: 90px; opacity: 0.9; }
    55%      { opacity: 0.3; }
  }

  @media (prefers-reduced-motion: reduce) {
    .qr-404 .qr-field,
    .qr-404 .qr-scan { animation: none; }
    .qr-404 .qr-scan { top: 50px; }
  }
</style>
